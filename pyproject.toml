[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rfs-mi300x"
version = "0.1.0"
description = "Root-Free Shampoo experiments for a 125M decoder-only transformer on MI300X"
requires-python = ">=3.12"
dependencies = [
  "huggingface-hub==1.26.0",
  "matplotlib==3.11.0",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "pyarrow==21.0.0",
  "tiktoken==0.13.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.1"]

[tool.setuptools.packages.find]
include = ["rfs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["leanproofs", "rfshampoo", "witness"]
